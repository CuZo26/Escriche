<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2d3d">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #fafbfa; color: #172031; }
    header { background: #1f2d3d; padding: 15px; text-align: center; }
    header a { color: white; font-size: 20px; font-weight: bold; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>

<header>
  <a href="https://github.io">
    [ ENTRAR A LA APP ]
  </a>
</header>

<script>
const KEY="control-produccion-editable-v1";
let state=JSON.parse(localStorage.getItem(KEY))||{date:new Date().toISOString().slice(0,10),lines:Array.from({length:5},(_,i)=>({id:i+1,breakdowns:[]}))};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render();toast("Guardado")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),3000)}
function setDate(v){state.date=v;state.lines.forEach(l=>l.date=v);save()}
function render(){document.getElementById("globalDate").value=state.date;document.getElementById("lines").innerHTML=state.lines.map(l=>`<h3>Línea ${l.id}</h3>`).join("")}
function saveLine(id){const l=state.lines.find(x=>x.id===id);["lot","desc","dias","fondos","humidity","speed","boxes"].forEach(k=>{l[k]=document.getElementById(k+id).value});save()}
function addBreakdown(id){const idm=document.getElementById("bdline").value;l=state.lines.find(x=>x.id==idm);const reason=document.getElementById("bdreason").value;const duration=parseInt(document.getElementById("bdduration").value)||0;const time=document.getElementById("bdtime").value;if(!reason){alert("Motivo requerido");return}l.breakdowns.push({id:Date.now(),time,duration,reason});save()}
function delBd(lineId,id){const l=state.lines.find(x=>x.id===lineId);l.breakdowns=l.breakdowns.filter(b=>b.id!==id);save()}
function newDay(){if(confirm("¿Empezar una nueva jornada? Se conservarán los datos solo si antes los exportas a Excel.")){state={date:new Date().toISOString().slice(0,10),lines:Array.from({length:5},(_,i)=>({id:i+1,breakdowns:[]}))};save()}}
function escXml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
function sheet(rows){let s=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Datos"><Table><Row><Cell><Data ss:Type="String">Línea</Data></Cell><Cell><Data ss:Type="String">Fecha</Data></Cell><Cell><Data ss:Type="String">Lote</Data></Cell><Cell><Data ss:Type="String">Descripción</Data></Cell></Row>`;rows.forEach(r=>{s+=`<Row><Cell><Data ss:Type="String">${escXml(r.line)}</Data></Cell><Cell><Data ss:Type="String">${escXml(r.date)}</Data></Cell></Row>`});s+=`</Table></Worksheet></Workbook>`;return s}
function exportXlsx(){let p=[];state.lines.forEach(l=>{p.push({line:l.id,date:state.date})});const blob=new Blob([sheet(p)],{type:"application/vnd.ms-excel"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`produccion_${state.date}.xls`;a.click()}
document.getElementById("bdat").value=new Date().toISOString().slice(0,10);render();
</script>
</body>
</html>
