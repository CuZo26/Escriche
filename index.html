<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d2d52">
<link rel="manifest" href="./manifest.json">
<title>Control de Producción</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#f4f6fa;color:#172033}
header{background:#fff;border-bottom:1px solid #dce2ea;padding:10px 12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.logo{width:42px;height:42px;border-radius:10px}.brand{font-weight:800}.sub{font-size:12px;color:#667085}
main{max-width:900px;margin:auto;padding:12px 10px 50px}
h1{font-size:22px}h2{font-size:18px}
button{border:0;border-radius:10px;padding:11px;font-weight:800;background:#1d2d52;color:#fff}
button.secondary{background:#eef2f7;color:#172033;border:1px solid #dce2ea}
button.danger{background:#fee4e2;color:#b42318}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day,.line{background:#fff;border:1px solid #dce2ea;border-radius:14px;padding:12px;margin:12px 0}
.line{padding:0;overflow:hidden}
.linehead{padding:12px;background:#eef2f7;display:flex;justify-content:space-between}
.form{padding:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label,.day label{display:block;font-size:11px;font-weight:800;color:#667085}
input,select,textarea{width:100%;padding:9px;border:1px solid #dce2ea;border-radius:9px;font:inherit}
.full{grid-column:1/-1}.save{width:100%;margin-top:10px;background:#18794e}
.production{border:1px solid #dce2ea;border-radius:10px;padding:9px;margin-top:8px;background:#fafbfc}
.production-head{display:flex;justify-content:space-between;align-items:center}
.production-title{font-weight:800}.data{font-size:12px;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.data span{color:#667085}.pactions{display:flex;gap:6px;margin-top:8px}.pactions button{padding:7px;font-size:12px}
.status{font-size:11px}.empty{font-size:12px;color:#667085;margin-top:8px}
.info{background:#e8f3ff;border:1px solid #b9ddff;padding:10px;border-radius:10px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:10px;display:none}
.toast.show{display:block}
@media(max-width:520px){.fields,.data,.actions{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>

<header>
<img class="logo" src="./icon-512.png" alt="">
<div><div class="brand">Control de Producción</div><div class="sub">5 líneas · Múltiples producciones</div></div>
</header>

<main>
<h1>Control de producción</h1>

<div class="info">
Cada vez que pulses guardar se crea una producción nueva. Las anteriores no se sobrescriben.
</div>

<div class="actions">
<button onclick="exportAll()">📊 TODAS A EXCEL</button>
<button class="secondary" onclick="newDay()">🔄 NUEVA JORNADA</button>
</div>

<div class="day">
<label>Fecha</label>
<input id="date" type="date" onchange="changeDate(this.value)">
</div>

<div id="lines"></div>

<h2>⚠️ Averías</h2>

<div class="day">
<div class="fields">

<div class="field">
<label>Línea</label>
<select id="bdline">
<option value="1">Línea 1</option><option value="2">Línea 2</option>
<option value="3">Línea 3</option><option value="4">Línea 4</option>
<option value="5">Línea 5</option>
</select>
</div>

<div class="field">
<label>Hora</label><input id="bdat" type="datetime-local">
</div>

<div class="field">
<label>Minutos</label><input id="bdmin" type="number" min="0">
</div>

<div class="field">
<label>Motivo</label><input id="bdreason" placeholder="Ej. atasco">
</div>

<div class="field full">
<label>Observaciones</label><textarea id="bdnotes"></textarea>
</div>

</div>

<button style="width:100%;margin-top:10px" onclick="addBreakdown()">+ GUARDAR AVERÍA</button>
</div>

<div id="breakdowns" class="day"></div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const KEY='escriche_produccion_v2',BDKEY='escriche_averias_v2';

const today=()=>{
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};

let currentDate=today();
let productions=JSON.parse(localStorage.getItem(KEY)||'[]');
let breakdowns=JSON.parse(localStorage.getItem(BDKEY)||'[]');

function save(){
 localStorage.setItem(KEY,JSON.stringify(productions));
 localStorage.setItem(BDKEY,JSON.stringify(breakdowns));
}

function toast(t){
 const x=document.getElementById('toast');
 x.textContent=t;x.classList.add('show');
 setTimeout(()=>x.classList.remove('show'),1800);
}

function esc(x){
 return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render(){
 document.getElementById('date').value=currentDate;
 renderLines();
 renderBreakdowns();
}

function renderLines(){
 let html='';

 for(let line=1;line<=5;line++){
  const rows=productions.filter(p=>p.fecha===currentDate&&p.linea===line);

  html+=`
  <div class="line">
   <div class="linehead">
    <b>LÍNEA ${line}</b>
    <span class="status">${rows.length} producción${rows.length===1?'':'es'}</span>
   </div>

   <div class="form">
    <div class="fields">

     <div class="field"><label>Número de lote</label>
     <input id="lot-${line}" placeholder="Ej. L-1234"></div>

     <div class="field"><label>Descripción</label>
     <input id="desc-${line}" placeholder="Caja grande"></div>

     <div class="field"><label>Tipo de fondos</label>
     <input id="fondos-${line}"></div>

     <div class="field"><label>Humedad</label>
     <input id="hum-${line}" placeholder="Ej. 12%"></div>

     <div class="field"><label>Velocidad (cajas/h)</label>
     <input id="speed-${line}" type="number" min="0"></div>

     <div class="field"><label>Cajas producidas</label>
     <input id="boxes-${line}" type="number" min="0"></div>

     <div class="field full"><label>Inicio</label>
     <input id="start-${line}" type="datetime-local"></div>

    </div>

    <button class="save" onclick="saveProduction(${line})">
     💾 GUARDAR PRODUCCIÓN
    </button>

    <div>
     ${rows.length?rows.slice().reverse().map(productionHTML).join(''):
     '<div class="empty">Sin producciones todavía.</div>'}
    </div>
   </div>
  </div>`;
 }

 document.getElementById('lines').innerHTML=html;
}

function productionHTML(p){
 return `
 <div class="production">
  <div class="production-head">
   <div class="production-title">${esc(p.lote||'Sin lote')}</div>
   <button class="danger" onclick="deleteProduction('${p.id}')">🗑️</button>
  </div>

  <div class="data">
   <div><span>Descripción:</span> ${esc(p.descripcion||'-')}</div>
   <div><span>Fondos:</span> ${esc(p.fondos||'-')}</div>
   <div><span>Humedad:</span> ${esc(p.humedad||'-')}</div>
   <div><span>Velocidad:</span> ${esc(p.velocidad||'-')}</div>
   <div><span>Cajas:</span> ${esc(p.cajas||'-')}</div>
   <div><span>Inicio:</span> ${esc(p.inicio||'-')}</div>
  </div>

  <div class="pactions">
   <button onclick="exportOne('${p.id}')">📥 Excel</button>
  </div>
 </div>`;
}

function saveProduction(line){
 const v=id=>document.getElementById(id+'-'+line).value.trim();

 const lote=v('lot'),descripcion=v('desc'),fondos=v('fondos');
 const humedad=v('hum'),velocidad=v('speed'),cajas=v('boxes');
 const inicio=v('start');

 if(!lote&&!descripcion&&!cajas&&!inicio){
  toast('Introduce algún dato');return;
 }

 productions.push({
  id:Date.now()+'_'+Math.random().toString(36).slice(2),
  fecha:currentDate,
  linea:line,
  lote,descripcion,fondos,humedad,velocidad,cajas,inicio,
  creado:new Date().toISOString()
 });

 save();
 render();
 toast('Producción guardada');
}

function deleteProduction(id){
 if(!confirm('¿Eliminar esta producción?'))return;
 productions=productions.filter(p=>p.id!==id);
 save();render();toast('Producción eliminada');
}

function changeDate(d){
 if(d){currentDate=d;render();}
}

function newDay(){
 currentDate=today();render();toast('Nueva jornada');
}

function addBreakdown(){
 const reason=document.getElementById('bdreason').value.trim();
 if(!reason){toast('Introduce el motivo');return;}

 breakdowns.push({
  id:Date.now()+'_'+Math.random().toString(36).slice(2),
  fecha:currentDate,
  linea:document.getElementById('bdline').value,
  at:document.getElementById('bdat').value,
  minutes:document.getElementById('bdmin').value,
  reason,
  notes:document.getElementById('bdnotes').value.trim()
 });

 document.getElementById('bdmin').value='';
 document.getElementById('bdreason').value='';
 document.getElementById('bdnotes').value='';

 save();render();toast('Avería guardada');
}

function renderBreakdowns(){
 const list=breakdowns.filter(b=>b.fecha===currentDate);
 document.getElementById('breakdowns').innerHTML=
 list.length?list.map(b=>`
 <div class="production">
  <b>Línea ${b.linea}</b><br>
  <small>${esc(b.reason)} · ${esc(b.minutes||0)} min</small>
  ${b.notes?'<br><small>'+esc(b.notes)+'</small>':''}
 </div>`).join(''):
 '<div class="empty">Sin averías.</div>';
}

function excel(rows,name){
 if(!rows.length){toast('No hay datos');return;}
 const data=rows.map(p=>({
  Fecha:p.fecha,
  Linea:p.linea,
  Lote:p.lote,
  Descripcion:p.descripcion,
  Fondos:p.fondos,
  Humedad:p.humedad,
  Velocidad:p.velocidad,
  Cajas:p.cajas,
  Inicio:p.inicio
 }));
 const ws=XLSX.utils.json_to_sheet(data);
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Producciones');
 XLSX.writeFile(wb,name);
}

function exportOne(id){
 const p=productions.find(x=>x.id===id);
 if(p)excel([p],'produccion_'+p.lote+'.xlsx');
}

function exportAll(){
 excel(productions,'producciones.xlsx');
}

render();
</script>

</body>
</html>
