<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2d52">
<link rel="manifest" href="./manifest.json">
<title>Control de Producción</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6fa;
  color:#172033
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #dce2ea;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover
}

.brand{font-weight:800}

.sub{
  font-size:12px;
  color:#667085
}

main{
  max-width:760px;
  margin:auto;
  padding:12px 10px 40px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:800;
  font-size:14px;
  background:#1d2d52;
  color:white;
  cursor:pointer
}

button.secondary{
  background:#eef2f7;
  color:#172033;
  border:1px solid #dce2ea
}

button.danger{
  background:#fee4e2;
  color:#b42318
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.day{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  padding:12px;
  margin-bottom:12px
}

.day label{
  font-size:12px;
  font-weight:700;
  color:#667085
}

.day input,
.day select{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  margin-top:4px
}

h1{
  font-size:22px;
  margin:8px 0 12px
}

h2{
  font-size:18px
}

.line{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  margin:12px 0;
  overflow:hidden
}

.linehead{
  padding:12px;
  background:#eef2f7;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.linehead b{
  font-size:18px
}

.status{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#fff
}

.form{
  padding:12px
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.field label{
  display:block;
  font-size:11px;
  font-weight:750;
  color:#667085;
  margin-bottom:3px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  background:#fff
}

.field textarea{
  min-height:62px
}

.full{
  grid-column:1/-1
}

.save{
  margin-top:10px;
  width:100%;
  background:#18794e
}

.section{
  margin-top:18px
}

.bd{
  border-top:1px solid #dce2ea;
  padding:10px 0
}

.small{
  font-size:12px;
  color:#667085
}

.empty{
  color:#667085;
  font-size:13px
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  opacity:0;
  transition:.2s;
  z-index:20;
  pointer-events:none
}

.toast.show{
  opacity:1
}

.loginBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px
}

.loginCard{
  background:#fff;
  border-radius:18px;
  padding:20px;
  width:100%;
  max-width:400px
}

.loginCard h2{
  margin-top:0
}

.loginCard input{
  width:100%;
  padding:11px;
  border:1px solid #dce2ea;
  border-radius:10px;
  margin:6px 0 10px;
  font:inherit
}

.userbar{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:12px
}

.userbar span{
  flex:1;
  font-size:12px;
  color:#667085
}

.history{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px
}

@media(max-width:520px){
  .fields{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <img class="logo" src="./icon-512.png" alt="Escriche">

  <div style="flex:1">
    <div class="brand">Control de Producción</div>
    <div class="sub">Consulta online · 5 líneas</div>
  </div>

  <button
    id="authButton"
    class="secondary"
    style="padding:8px 10px"
    onclick="openLogin()"
  >
    🔐 Entrar
  </button>
</header>

<main>

  <div class="userbar">
    <span id="modeText">
      Modo consulta · Datos online
    </span>

    <button
      id="logoutButton"
      class="secondary"
      style="display:none;padding:8px 10px"
      onclick="logout()"
    >
      Salir
    </button>
  </div>

  <h1>Control de producción</h1>

  <div class="actions">
    <button onclick="exportXlsx()">
      📊 EXPORTAR A EXCEL
    </button>

    <button
      id="newDayButton"
      class="secondary"
      onclick="newDay()"
      disabled
    >
      🔄 NUEVA JORNADA
    </button>
  </div>

  <div class="day">
    <label>Consultar fecha</label>

    <div class="history">
      <input
        id="globalDate"
        type="date"
        onchange="changeDate(this.value)"
      >

      <button
        class="secondary"
        onclick="loadSelectedDate()"
      >
        🔄 Cargar
      </button>
    </div>
  </div>

  <div class="day">
    <label>Historial disponible</label>

    <select
      id="historySelect"
      onchange="changeDate(this.value)"
    >
      <option value="">Selecciona una fecha</option>
    </select>
  </div>

  <div id="lines"></div>

  <section class="section">

    <h2>⚠️ Averías</h2>

    <div class="day">

      <div class="fields">

        <div class="field">
          <label>Línea</label>
          <select id="bdline"></select>
        </div>

        <div class="field">
          <label>Hora</label>
          <input id="bdat" type="datetime-local">
        </div>

        <div class="field">
          <label>Duración (minutos)</label>
          <input id="bdmin" type="number" min="0">
        </div>

        <div class="field">
          <label>Motivo / avería</label>
          <input
            id="bdreason"
            placeholder="Ej. atasco, cuchilla…"
          >
        </div>

        <div class="field full">
          <label>Observaciones</label>
          <textarea id="bdnotes"></textarea>
        </div>

      </div>

      <button
        id="addBreakdownButton"
        style="margin-top:10px;width:100%"
        onclick="addBreakdown()"
        disabled
      >
        + GUARDAR AVERÍA
      </button>

    </div>

    <div id="breakdowns" class="day"></div>

  </section>

</main>

<div id="loginBox" class="loginBox">

  <div class="loginCard">

    <h2>🔐 Acceso administrador</h2>

    <label>Correo electrónico</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="username"
    >

    <label>Contraseña</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
    >

    <button
      style="width:100%;margin-top:5px"
      onclick="login()"
    >
      Entrar
    </button>

    <button
      class="secondary"
      style="width:100%;margin-top:8px"
      onclick="closeLogin()"
    >
      Cancelar
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  'https://nbtzhmiyhfkolverzkmf.supabase.co';

/*
  PEGA AQUÍ TU CLAVE sb_publishable_...
  No la publiques en el chat.
*/

const SUPABASE_KEY =
  'sb_publishable_7J1ZWanI_-SgZBABNxtU2w_Ymb__dT7';

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   DATOS
========================================================= */

const EMPTY_LINE = id => ({
  id,
  lot:'',
  desc:'',
  dims:'',
  fondos:'',
  humidity:'',
  speed:'',
  boxes:'',
  start:'',
  breakdowns:[]
});

let allRows = [];

let currentDate =
  new Date().toLocaleDateString(
    'en-CA'
  );

let isAdmin = false;


/* =========================================================
   FECHA LOCAL
========================================================= */

function localDate(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1).padStart(2,'0');

  const day =
    String(d.getDate()).padStart(2,'0');

  return `${y}-${m}-${day}`;
}


/* =========================================================
   TOAST
========================================================= */

function toast(t){

  const x =
    document.getElementById('toast');

  x.textContent = t;

  x.classList.add('show');

  setTimeout(
    () => x.classList.remove('show'),
    1800
  );
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function esc(v){

  return String(v ?? '').replace(
    /[&<>"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );
}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

async function checkAuth(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  isAdmin =
    !!data.session;

  updateMode();

  render();
}


function updateMode(){

  const authButton =
    document.getElementById('authButton');

  const logoutButton =
    document.getElementById('logoutButton');

  const newDayButton =
    document.getElementById('newDayButton');

  const addBreakdownButton =
    document.getElementById(
      'addBreakdownButton'
    );

  const modeText =
    document.getElementById('modeText');

  if(isAdmin){

    authButton.style.display =
      'none';

    logoutButton.style.display =
      'block';

    newDayButton.disabled =
      false;

    addBreakdownButton.disabled =
      false;

    modeText.textContent =
      '🔐 Administrador · Puedes editar los datos';

  }else{

    authButton.style.display =
      'block';

    logoutButton.style.display =
      'none';

    newDayButton.disabled =
      true;

    addBreakdownButton.disabled =
      true;

    modeText.textContent =
      '👁️ Modo consulta · Solo lectura';

  }
}


function openLogin(){

  document.getElementById(
    'loginBox'
  ).style.display = 'flex';

}


function closeLogin(){

  document.getElementById(
    'loginBox'
  ).style.display = 'none';

}


async function login(){

  const email =
    document.getElementById(
      'loginEmail'
    ).value.trim();

  const password =
    document.getElementById(
      'loginPassword'
    ).value;

  if(!email || !password){

    toast('Introduce correo y contraseña');

    return;
  }


  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    console.error(error);

    toast(
      'No se pudo iniciar sesión'
    );

    return;
  }


  closeLogin();

  isAdmin = true;

  updateMode();

  render();

  toast('Sesión iniciada');

}


async function logout(){

  await supabaseClient.auth.signOut();

  isAdmin = false;

  updateMode();

  render();

  toast('Sesión cerrada');

}


supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    isAdmin =
      !!session;

    updateMode();

    render();

  }
);


/* =========================================================
   CARGAR DATOS ONLINE
========================================================= */

async function loadAll(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from('Producción')
      .select('*')
      .order('Fecha', {ascending:false})
      .order('Linea', {ascending:true});


  if(error){

    console.error(error);

    toast(
      'Error cargando los datos'
    );

    return;
  }


  allRows =
    data || [];


  updateHistory();

  render();

}


/* =========================================================
   HISTORIAL
========================================================= */

function updateHistory(){

  const dates =
    [...new Set(
      allRows
        .map(r => r.Fecha)
        .filter(Boolean)
    )]
    .sort()
    .reverse();


  const select =
    document.getElementById(
      'historySelect'
    );


  select.innerHTML =
    '<option value="">Selecciona una fecha</option>' +

    dates.map(
      d =>
        `<option value="${esc(d)}">${esc(d)}</option>`
    ).join('');


  if(dates.includes(currentDate)){

    select.value =
      currentDate;

  }

}


function changeDate(date){

  if(!date) return;

  currentDate =
    date;

  document.getElementById(
    'globalDate'
  ).value =
    date;

  document.getElementById(
    'historySelect'
  ).value =
    date;

  render();

}


function loadSelectedDate(){

  const date =
    document.getElementById(
      'globalDate'
    ).value;

  if(date){

    changeDate(date);

  }

}


/* =========================================================
   OBTENER LAS 5 LÍNEAS
========================================================= */

function getLinesForDate(){

  const result =
    Array.from(
      {length:5},
      (_,i) => EMPTY_LINE(i+1)
    );


  allRows
    .filter(
      r =>
        String(r.Fecha) ===
        String(currentDate)
    )
    .forEach(r => {

      const id =
        Number(r.Linea);

      const line =
        result.find(
          x => x.id === id
        );

      if(!line) return;


      line.lot =
        r.Lote || '';

      line.desc =
        r['Descripción'] || '';

      line.dims =
        r['Dimensiones'] || '';

      line.fondos =
        r.Fondos || '';

      line.humidity =
        r.Humedad || '';

      line.speed =
        r.Velocidad ?? '';

      line.boxes =
        r.Cajas ?? '';

      line.start =
        r.Inicio || '';

      line.breakdowns =
        Array.isArray(r.Averías)
        ? r.Averías
        : [];

    });


  return result;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById(
    'globalDate'
  ).value =
    currentDate;


  const lines =
    getLinesForDate();


  document.getElementById(
    'lines'
  ).innerHTML =
    lines.map(l => `

      <div class="line">

        <div class="linehead">

          <b>LÍNEA ${l.id}</b>

          <span class="status">
            ${l.start
              ? 'EN PRODUCCIÓN'
              : 'PARADA'}
          </span>

        </div>

        <div class="form">

          <div class="fields">

            <div class="field">
              <label>Número de lote</label>
              <input
                id="lot-${l.id}"
                value="${esc(l.lot)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Descripción de la caja</label>
              <input
                id="desc-${l.id}"
                value="${esc(l.desc)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Dimensiones</label>
              <input
                id="dims-${l.id}"
                value="${esc(l.dims)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Tipo de fondos</label>
              <input
                id="fondos-${l.id}"
                value="${esc(l.fondos)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Humedad del cuadradillo</label>
              <input
                id="humidity-${l.id}"
                value="${esc(l.humidity)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Velocidad (cajas/hora)</label>
              <input
                id="speed-${l.id}"
                type="number"
                min="0"
                value="${esc(l.speed)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Cajas producidas</label>
              <input
                id="boxes-${l.id}"
                type="number"
                min="0"
                value="${esc(l.boxes)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

            <div class="field">
              <label>Inicio de producción</label>
              <input
                id="start-${l.id}"
                type="datetime-local"
                value="${formatDateTimeLocal(l.start)}"
                ${isAdmin ? '' : 'disabled'}
              >
            </div>

          </div>

          <button
            class="save"
            onclick="saveLine(${l.id})"
            ${isAdmin ? '' : 'disabled'}
          >
            💾 GUARDAR LÍNEA ${l.id}
          </button>

        </div>

      </div>

    `).join('');


  document.getElementById(
    'bdline'
  ).innerHTML =
    lines.map(
      l =>
        `<option value="${l.id}">
          Línea ${l.id}
        </option>`
    ).join('');


  renderBreakdowns(lines);

}


function formatDateTimeLocal(value){

  if(!value) return '';

  if(
    typeof value === 'string' &&
    value.length >= 16 &&
    value.includes('T')
  ){

    return value.slice(0,16);

  }

  try{

    return new Date(value)
      .toISOString()
      .slice(0,16);

  }catch{

    return '';

  }

}


/* =========================================================
   AVERÍAS
========================================================= */

function renderBreakdowns(lines){

  const all =
    lines.flatMap(
      l =>
        (l.breakdowns || []).map(
          b => ({
            ...b,
            line:l.id
          })
        )
    )
    .sort(
      (a,b) =>
        String(b.at || '')
          .localeCompare(
            String(a.at || '')
          )
    );


  document.getElementById(
    'breakdowns'
  ).innerHTML =
    all.length

    ?

    all.map(b => `

      <div class="bd">

        <b>
          Línea ${b.line} ·
          ${esc(b.reason || 'Avería')}
        </b>

        <div class="small">

          ${esc(b.at || '')}
          ·
          ${b.minutes || 0} min

          ${
            b.notes
            ? ' · ' + esc(b.notes)
            : ''
          }

        </div>

        ${
          isAdmin
          ?
          `<button
            class="danger"
            style="margin-top:7px;padding:7px 10px"
            onclick="delBd(${b.line},'${esc(b.id)}')"
          >
            Eliminar
          </button>`
          :
          ''
        }

      </div>

    `).join('')

    :

    '<div class="empty">Todavía no hay averías.</div>';

}


/* =========================================================
   GUARDAR LÍNEA EN SUPABASE
========================================================= */

async function saveLine(id){

  if(!isAdmin){

    toast('Necesitas iniciar sesión');

    return;
  }


  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if(!session){

    toast('Necesitas iniciar sesión');

    return;
  }


  const existing =
    allRows.find(
      r =>
        String(r.Fecha) ===
        String(currentDate) &&
        Number(r.Linea) ===
        Number(id)
    );


  const values = {

    Fecha:
      currentDate,

    Linea:
      id,

    Lote:
      document.getElementById(
        `lot-${id}`
      ).value.trim(),

    'Descripción':
      document.getElementById(
        `desc-${id}`
      ).value.trim(),

    'Dimensiones':
      document.getElementById(
        `dims-${id}`
      ).value.trim(),

    Fondos:
      document.getElementById(
        `fondos-${id}`
      ).value.trim(),

    Humedad:
      document.getElementById(
        `humidity-${id}`
      ).value.trim(),

    Velocidad:
      document.getElementById(
        `speed-${id}`
      ).valu
