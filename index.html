<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2d3d">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #fafbfa; color: #172031; padding-bottom: 40px; }
    header { background: #1f2d3d; padding: 15px; text-align: center; }
    header a { display: inline-block; text-decoration: none; }
    .logo { max-height: 55px; width: auto; display: block; margin: 0 auto; border: none; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .btn { background: #1f2d3d; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-right: 10px; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .section { margin-top: 25px; border-top: 1px solid #ddd; padding-top: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <a href="https://github.io">
    <img class="logo" src="https://icons8.com" alt="Control de Producción" />
  </a>
</header>
  

<div class="container">
  <h2>Control de Producción</h2>
  <p>Rellenar durante el día · 5 líneas</p>
  
  <h3># Control de hoy</h3>
  <button class="btn" onclick="exportXlsx()">📊 EXPORTAR A EXCEL</button>
  <button class="btn btn-secondary" onclick="newDay()">🔄 NUEVA JORNADA</button>

  <div class="form-group" style="margin-top:15px;">
    <label>Fecha de producción</label>
    <input type="date" id="bdat">
  </div>

  <div id="lines"></div>

  <div class="section">
    <h3>⚠ Averías</h3>
    <div class="form-group">
      <label>Línea</label>
      <select id="bdline">
        <option value="1">Línea 1</option>
        <option value="2">Línea 2</option>
        <option value="3">Línea 3</option>
        <option value="4">Línea 4</option>
        <option value="5">Línea 5</option>
      </select>
    </div>
    <div class="form-group">
      <label>Hora</label>
      <input type="time" id="bdtime">
    </div>
    <div class="form-group">
      <label>Duración (minutos)</label>
      <input type="number" id="bdduration">
    </div>
    <div class="form-group">
      <label>Motivo / avería</label>
      <input type="text" id="bdreason">
    </div>
    <div class="form-group">
      <label>Observaciones</label>
      <textarea id="bdobs"></textarea>
    </div>
    <button class="btn" onclick="addBreakdown()">+ GUARDAR AVERÍA</button>
  </div>
</div>

<script>
const KEY="control-produccion-editable-v1";
let state=JSON.parse(localStorage.getItem(KEY))||{date:new Date().toISOString().slice(0,10),lines:Array.from({length:5},(_,i)=>({id:i+1,breakdowns:[]}))};

function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}

function newDay(){
  if(confirm("¿Empezar una nueva jornada? Se conservarán los datos solo si antes los exportas a Excel.")){
    state={date:new Date().toISOString().slice(0,10),lines:Array.from({length:5},(_,i)=>({id:i+1,breakdowns:[]}))};
    save();
  }
}

function addBreakdown(){
  const lineId=parseInt(document.getElementById("bdline").value);
  const reason=document.getElementById("bdreason").value;
  const duration=parseInt(document.getElementById("bdduration").value)||0;
  const time=document.getElementById("bdtime").value;
  if(!reason){alert("Motivo requerido");return}
  const l=state.lines.find(x=>x.id===lineId);
  l.breakdowns.push({id:Date.now(),time,duration,reason});
  save();
  document.getElementById("bdreason").value="";
  document.getElementById("bdduration").value="";
}

function render(){
  document.getElementById("bdat").value=state.date;
  document.getElementById("lines").innerHTML=state.lines.map(l=>`
    <div style="margin-top:15px; padding:10px; background:#f9f9f9; border:1px solid #eee;">
      <h4>Línea ${l.id}</h4>
      \${l.breakdowns.length===0?'<p style="color:gray;font-size:14px;">Sin averías hoy</p>':`
        <table>
          <thead><tr><th>Hora</th><th>Min</th><th>Motivo</th></tr></thead>
          <tbody>
            \${l.breakdowns.map(b=>`<tr><td>\${b.time||'-'}</td><td>\${b.duration}</td><td>\${b.reason}</td></tr>`).join('')}
          </tbody>
        </table>
      `}
    </div>
  `).join("");
}

function escXml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}

function exportXlsx(){
  let s=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Produccion"><Table><Row><Cell><Data ss:Type="String">Linea</Data></Cell><Cell><Data ss:Type="String">Fecha</Data></Cell><Cell><Data ss:Type="String">Hora</Data></Cell><Cell><Data ss:Type="String">Duracion</Data></Cell><Cell><Data ss:Type="String">Motivo</Data></Cell></Row>`;
  state.lines.forEach(l=>{
    l.breakdowns.forEach(b=>{
      s+=`<Row><Cell><Data ss:Type="Number">\${l.id}</Data></Cell><Cell><Data ss:Type="String">\${state.date}</Data></Cell><Cell><Data ss:Type="String">\${escXml(b.time)}</Data></Cell><Cell><Data ss:Type="Number">\${b.duration}</Data></Cell><Cell><Data ss:Type="String">\${escXml(b.reason)}</Data></Cell></Row>`;
    });
  });
  s+=`</Table></Worksheet></Workbook>`;
  const blob=new Blob([s],{type:"application/vnd.ms-excel"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`produccion_\${state.date}.xls`;
  a.click();
}

document.getElementById("bdat").addEventListener("change",(e)=>{state.date=e.target.value;save();});
render();
</script>
</body>
</html>
