<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2d52">
<link rel="manifest" href="./manifest.json">

<title>Control de Producción</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6fa;
  color:#172033
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #dce2ea;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover
}

.brand{font-weight:800}

.sub{
  font-size:12px;
  color:#667085
}

main{
  max-width:900px;
  margin:auto;
  padding:12px 10px 50px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:800;
  font-size:14px;
  background:#1d2d52;
  color:white;
  cursor:pointer
}

button.secondary{
  background:#eef2f7;
  color:#172033;
  border:1px solid #dce2ea
}

button.danger{
  background:#fee4e2;
  color:#b42318
}

.day{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  padding:12px;
  margin-bottom:12px
}

.day label{
  font-size:12px;
  font-weight:700;
  color:#667085
}

.day input,
.day select{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  margin-top:4px
}

h1{
  font-size:22px;
  margin:8px 0 12px
}

h2{
  font-size:18px;
  margin:10px 0
}

.line{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  margin:12px 0;
  overflow:hidden
}

.linehead{
  padding:12px;
  background:#eef2f7;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.linehead b{
  font-size:18px
}

.status{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#fff
}

.form{
  padding:12px
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.field label{
  display:block;
  font-size:11px;
  font-weight:750;
  color:#667085;
  margin-bottom:3px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  background:#fff
}

.field textarea{
  min-height:62px
}

.full{
  grid-column:1/-1
}

.save{
  margin-top:10px;
  width:100%;
  background:#18794e
}

.production-list{
  margin-top:12px
}

.production{
  border:1px solid #dce2ea;
  border-radius:12px;
  padding:10px;
  margin-top:8px;
  background:#fafbfc
}

.production-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.production-title{
  font-weight:800
}

.production-data{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px 12px;
  margin-top:7px;
  font-size:12px
}

.production-data span{
  color:#667085
}

.production-actions{
  margin-top:8px;
  display:flex;
  gap:6px
}

.production-actions button{
  padding:7px 10px;
  font-size:12px
}

.empty{
  color:#667085;
  font-size:13px;
  padding:5px 0
}

.section{
  margin-top:18px
}

.bd{
  border-top:1px solid #dce2ea;
  padding:10px 0
}

.small{
  font-size:12px;
  color:#667085
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  opacity:0;
  transition:.2s;
  z-index:20;
  pointer-events:none
}

.toast.show{
  opacity:1
}

.info{
  background:#e8f3ff;
  border:1px solid #b9ddff;
  color:#164c7e;
  padding:10px;
  border-radius:12px;
  font-size:13px;
  margin-bottom:12px
}

@media(max-width:520px){

  .fields{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .actions{
    grid-template-columns:1fr
  }

  .production-data{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>

  <img
    class="logo"
    src="./icon-512.png"
    alt="Escriche"
  >

  <div style="flex:1">

    <div class="brand">
      Control de Producción
    </div>

    <div class="sub">
      5 líneas · Múltiples producciones
    </div>

  </div>

</header>


<main>

  <h1>Control de producción</h1>

  <div class="info">
    Los datos se guardan automáticamente en este dispositivo.
    Cada producción es independiente y no sobrescribe las anteriores.
  </div>


  <div class="actions">

    <button onclick="exportExcel()">
      📊 EXPORTAR A EXCEL
    </button>

    <button
      class="secondary"
      onclick="newDay()"
    >
      🔄 NUEVA JORNADA
    </button>

  </div>


  <!-- FECHA -->

  <div class="day">

    <label>
      Fecha de producción
    </label>

    <input
      id="globalDate"
      type="date"
      onchange="changeDate(this.value)"
    >

  </div>


  <!-- HISTORIAL -->

  <div class="day">

    <label>
      Historial disponible
    </label>

    <select
      id="historySelect"
      onchange="changeDate(this.value)"
    >
      <option value="">
        Selecciona una fecha
      </option>
    </select>

  </div>


  <!-- LÍNEAS -->

  <div id="lines"></div>


  <!-- AVERÍAS -->

  <section class="section">

    <h2>⚠️ Averías</h2>

    <div class="day">

      <div class="fields">

        <div class="field">

          <label>
            Línea
          </label>

          <select id="bdline">

            <option value="1">
              Línea 1
            </option>

            <option value="2">
              Línea 2
            </option>

            <option value="3">
              Línea 3
            </option>

            <option value="4">
              Línea 4
            </option>

            <option value="5">
              Línea 5
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Hora
          </label>

          <input
            id="bdat"
            type="datetime-local"
          >

        </div>


        <div class="field">

          <label>
            Duración (minutos)
          </label>

          <input
            id="bdmin"
            type="number"
            min="0"
          >

        </div>


        <div class="field">

          <label>
            Motivo / avería
          </label>

          <input
            id="bdreason"
            placeholder="Ej. atasco, cuchilla…"
          >

        </div>


        <div class="field full">

          <label>
            Observaciones
          </label>

          <textarea id="bdnotes"></textarea>

        </div>

      </div>


      <button
        style="margin-top:10px;width:100%"
        onclick="addBreakdown()"
      >
        + GUARDAR AVERÍA
      </button>

    </div>


    <div
      id="breakdowns"
      class="day"
    ></div>

  </section>

</main>


<div
  id="toast"
  class="toast"
></div>


<!-- Librería para crear Excel -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const STORAGE_KEY =
  'escriche_produccion_v2';

const BREAKDOWN_KEY =
  'escriche_averias_v2';


/* =========================================================
   FECHA ACTUAL
========================================================= */

function localDate(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth() + 1)
      .padStart(2,'0');

  const day =
    String(d.getDate())
      .padStart(2,'0');

  return `${y}-${m}-${day}`;
}


let currentDate =
  localDate();


/* =========================================================
   DATOS
========================================================= */

let productions =
  JSON.parse(
    localStorage.getItem(
      STORAGE_KEY
    ) || '[]'
  );


let breakdowns =
  JSON.parse(
    localStorage.getItem(
      BREAKDOWN_KEY
    ) || '[]'
  );


/* =========================================================
   GUARDAR DATOS
========================================================= */

function saveStorage(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(productions)
  );

  localStorage.setItem(
    BREAKDOWN_KEY,
    JSON.stringify(breakdowns)
  );

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const element =
    document.getElementById('toast');

  element.textContent =
    message;

  element.classList.add('show');

  setTimeout(
    () =>
      element.classList.remove('show'),
    1800
  );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );

}


/* =========================================================
   LÍNEAS
========================================================= */

function render(){

  document.getElementById(
    'globalDate'
  ).value =
    currentDate;


  renderLines();

  renderHistory();

  renderBreakdowns();

}


/* =========================================================
   RENDER DE LAS 5 LÍNEAS
========================================================= */

function renderLines(){

  const container =
    document.getElementById('lines');


  let html = '';


  for(let line = 1; line <= 5; line++){

    const rows =
      productions.filter(
        p =>
          p.fecha === currentDate &&
          Number(p.linea) === line
      );


    html += `

      <div class="line">

        <div class="linehead">

          <b>
            LÍNEA ${line}
          </b>

          <span class="status">
            ${rows.length
              ? rows.length + ' producción' +
                (rows.length === 1 ? '' : 'es')
              : 'Sin producción'}
          </span>

        </div>


        <div class="form">

          <div class="fields">

            <div class="field">

              <label>
                Número de lote
              </label>

              <input
                id="lot-${line}"
                placeholder="Ej. L-1234"
              >

            </div>


            <div class="field">

              <label>
                Descripción de la caja
              </label>

              <input
                id="desc-${line}"
                placeholder="Ej. Caja grande"
              >

            </div>


            <div class="field">

              <label>
                Tipo de fondos
              </label>

              <input
                id="fondos-${line}"
                placeholder="Tipo de fondo"
              >

            </div>


            <div class="field">

              <label>
                Humedad del cuadradillo
              </label>

              <input
                id="humidity-${line}"
                placeholder="Ej. 12%"
              >

            </div>


            <div class="field">

              <label>
                Velocidad (cajas/hora)
              </label>

              <input
                id="speed-${line}"
                type="number"
                min="0"
              >

            </div>


            <div class="field">

              <label>
                Cajas producidas
              </label>

              <input
                id="boxes-${line}"
                type="number"
                min="0"
              >

            </div>


            <div class="field full">

              <label>
                Inicio de producción
              </label>

              <input
                id="start-${line}"
                type="datetime-local"
              >

            </div>

          </div>


          <button
            class="save"
            onclick="saveProduction(${line})"
          >
            💾 GUARDAR PRODUCCIÓN LÍNEA ${line}
          </button>


          <div class="production-list">

            ${
              rows.length

              ?

              rows
                .slice()
                .sort(
                  (a,b) =>
                    String(b.inicio || '')
                      .localeCompare(
                        String(a.inicio || '')
                      )
                )
                .map(
                  p => productionHTML(p)
                )
                .join('')

              :

              '<div class="empty">Todavía no hay producciones en esta línea.</div>'
            }

          </div>

        </div>

      </div>

    `;

  }


  container.innerHTML =
    html;

}


/* =========================================================
   HTML DE UNA PRODUCCIÓN
========================================================= */

function productionHTML(p){

  return `

    <div class="production">

      <div class="production-head">

        <div class="production-title">
          ${esc(p.lote || 'Sin lote')}
        </div>

        <button
          class="danger"
          onclick="deleteProduction('${p.id}')"
        >
          🗑️
        </button>

      </div>


      <div class="production-data">

        <div>
          <span>Descripción:</span>
          ${esc(p.descripcion || '-')}
        </div>

        <div>
          <span>Fondos:</span>
          ${esc(p.fondos || '-')}
        </div>

        <div>
          <span>Humedad:</span>
          ${esc(p.humedad || '-')}
        </div>

        <div>
          <span>Velocidad:</span>
          ${esc(p.velocidad || '-')}
        </div>

        <div>
          <span>Cajas:</span>
          ${esc(p.cajas || '-')}
        </div>

        <div>
          <span>Inicio:</span>
          ${esc(formatDateTime(p.inicio))}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   GUARDAR PRODUCCIÓN
========================================================= */

function saveProduction(line){

  const lote =
    document.getElementById(
      `lot-${line}`
    ).value.trim();


  const descripcion =
    document.getElementById(
      `desc-${line}`
    ).value.trim();


  const fondos =
    document.getElementById(
      `fondos-${line}`
    ).value.trim();


  const humedad =
    document.getElementById(
      `humidity-${line}`
    ).value.trim();


  const velocidad =
    document.getElementById(
      `speed-${line}`
    ).value;


  const cajas =
    document.getElementById(
      `boxes-${line}`
    ).value;


  const inicio =
    document.getElementById(
      `start-${line}`
    ).value;


  if(
    !lote &&
    !descripcion &&
    !cajas &&
    !inicio
  ){

    toast(
      'Introduce al menos lote, cajas o inicio'
    );

    return;

  }


  const production = {

    id:
      Date.now().toString() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    fecha:
      currentDate,

    linea:
      Number(line),

    lote:
      lote,

    descripcion:
      descripcion,

    fondos:
      fondos,

    humedad:
      humedad,

    velocidad:
      velocidad,

    cajas:
      cajas,

    inicio:
      inicio,

    creado:
      new Date().toISOString()

  };


  productions.push(
    production
  );


  saveStorage();


  /*
    Limpiamos el formulario después
    de guardar para poder introducir
    inmediatamente la siguiente producción.
  */

  clearProductionForm(line);


  render();


  toast(
    `Producción guardada en línea ${line}`
  );

}


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function clearProductionForm(line){

  document.getElementById(
    `lot-${line}`
  ).value = '';

  document.getElementById(
    `desc-${line}`
  ).value = '';

  document.getElementById(
    `fondos-${line}`
  ).value = '';

  document.getElementById(
    `humidity-${line}`
  ).value = '';

  document.getElementById(
    `speed-${line}`
  ).value = '';

  document.getElementById(
    `boxes-${line}`
  ).value = '';

  document.getElementById(
    `start-${line}`
  ).value = '';

}


/* =========================================================
   BORRAR PRODUCCIÓN
========================================================= */

function deleteProduction(id){

  if(
    !confirm(
      '¿Quieres eliminar esta producción?'
    )
  ){

    return;

  }


  productions =
    productions.filter(
      p => String(p.id) !== String(id)
    );


  saveStorage();

  render();

  toast(
    'Producción eliminada'
  );

}


/* =========================================================
   HISTORIAL
========================================================= */

function renderHistory(){

  const dates =
    [
      ...new Set(
        productions
          .map(p => p.fecha)
          .filter(Boolean)
      )
    ]
    .sort()
    .reverse();


  const select =
    document.getElementById(
      'historySelect'
    );


  select.innerHTML =
    '<option value="">Selecciona una fecha</option>' +

    dates.map(
      date =>
        `<option value="${esc(date)}">
          ${esc(date)}
        </option>`
    ).join('');


  select.value =
    currentDate;

}


/* =========================================================
   CAMBIAR FECHA
========================================================= */

function changeDate(date){

  if(!date){

    return;

  }


  currentDate =
    date;


  render();

}


/* =========================================================
   NUEVA JORNADA
========================================================= */

function newDay(){

  const today =
    localDate();


  currentDate =
    today;


  render();

  toast(
    'Nueva jornada preparada'
  );

}


/* =========================================================
   FECHA/HORA PARA MOSTRAR
========================================================= */

function formatDateTime(value){

  if(!value){

    return '-';

  }


  try{

    const d =
      new Date(value);


    if(
      Number.isNaN(
        d.getTime()
      )
    ){

      return value;

    }


    return d.toLocaleString(
      'es-ES',
      {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      }
    );

  }catch{

    return value;

  }

}


/* =========================================================
   AVERÍAS
========================================================= */

function addBreakdown(){

  const line =
    Number(
      document.getElementById(
        'bdline'
      ).value
    );


  const at =
    document.getElementById(
      'bdat'
    ).value;


  const minutes =
    document.getElementById(
      'bdmin'
    ).value;


  const reason =
    document.getElementById(
      'bdreason'
    ).value.trim();


  const notes =
    document.getElementById(
      'bdnotes'
    ).value.trim();


  if(!reason){

    toast(
      'Introduce el motivo de la avería'
    );

    return;

  }


  breakdowns.push({

    id:
      Date.now().toString() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    fecha:
      currentDate,

    linea:
      line,

    at:
      at,

    minutes:
      minutes,

    reason:
      reason,

    notes:
      notes

  });


  saveStorage();


  document.getElementById(
    'bdmin'
  ).value = '';

  document.getElementById(
    'bdreason'
  ).value = '';

  document.getElementById(
    'bdnotes'
  ).value = '';


  render();

  toast(
    'Avería guardada'
  );

}


/* =========================================================
   MOSTRAR AVERÍAS
========================================================= */

function renderBreakdowns(){

  const list =
    breakdowns
      .filter(
        b =>
          b.fecha === currentDate
      )
      .so
