<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1d2d52">
<link rel="manifest" href="./manifest.json">

<title>Control de Producción</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6fa;
  color:#172033
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #dce2ea;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover
}

.brand{
  font-weight:800
}

.sub{
  font-size:12px;
  color:#667085
}

main{
  max-width:760px;
  margin:auto;
  padding:12px 10px 40px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:800;
  font-size:14px;
  background:#1d2d52;
  color:white;
  cursor:pointer
}

button.secondary{
  background:#eef2f7;
  color:#172033;
  border:1px solid #dce2ea
}

button.danger{
  background:#fee4e2;
  color:#b42318
}

.day{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  padding:12px;
  margin-bottom:12px
}

.day label{
  font-size:12px;
  font-weight:700;
  color:#667085
}

.day input{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  margin-top:4px
}

h1{
  font-size:22px;
  margin:8px 0 12px
}

.line{
  background:#fff;
  border:1px solid #dce2ea;
  border-radius:16px;
  margin:12px 0;
  overflow:hidden
}

.linehead{
  padding:12px;
  background:#eef2f7;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.linehead b{
  font-size:18px
}

.status{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#fff
}

.form{
  padding:12px
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.field label{
  display:block;
  font-size:11px;
  font-weight:750;
  color:#667085;
  margin-bottom:3px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid #dce2ea;
  border-radius:10px;
  font:inherit;
  background:#fff
}

.field textarea{
  min-height:62px
}

.full{
  grid-column:1/-1
}

.save{
  margin-top:10px;
  width:100%;
  background:#18794e
}

.section{
  margin-top:18px
}

.section h2{
  font-size:18px
}

.bd{
  border-top:1px solid #dce2ea;
  padding:10px 0
}

.small{
  font-size:12px;
  color:#667085
}

.empty{
  color:#667085;
  font-size:13px
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  opacity:0;
  transition:.2s;
  z-index:20;
  pointer-events:none
}

.toast.show{
  opacity:1
}

@media(max-width:520px){
  .fields{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>

  <img
    class="logo"
    src="./icon-512.png"
    alt="Escriche"
  >

  <div>
    <div class="brand">Control de Producción</div>
    <div class="sub">Rellenar durante el día · 5 líneas</div>
  </div>

</header>

<main>

  <h1>Control de hoy</h1>

  <div class="actions">
    <button onclick="exportXlsx()">
      📊 EXPORTAR A EXCEL
    </button>

    <button class="secondary" onclick="newDay()">
      🔄 NUEVA JORNADA
    </button>
  </div>

  <div class="day">
    <label>Fecha de producción</label>
    <input
      id="globalDate"
      type="date"
      onchange="setDate(this.value)"
    >
  </div>

  <div id="lines"></div>

  <section class="section">

    <h2>⚠️ Averías</h2>

    <div class="day">

      <div class="fields">

        <div class="field">
          <label>Línea</label>
          <select id="bdline"></select>
        </div>

        <div class="field">
          <label>Hora</label>
          <input
            id="bdat"
            type="datetime-local"
          >
        </div>

        <div class="field">
          <label>Duración (minutos)</label>
          <input
            id="bdmin"
            type="number"
            min="0"
          >
        </div>

        <div class="field">
          <label>Motivo / avería</label>
          <input
            id="bdreason"
            placeholder="Ej. atasco, cuchilla…"
          >
        </div>

        <div class="field full">
          <label>Observaciones</label>
          <textarea id="bdnotes"></textarea>
        </div>

      </div>

      <button
        style="margin-top:10px;width:100%"
        onclick="addBreakdown()"
      >
        + GUARDAR AVERÍA
      </button>

    </div>

    <div id="breakdowns" class="day"></div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   DATOS
========================================================= */

const KEY = 'control-produccion-editable-v1';

let state =
  JSON.parse(localStorage.getItem(KEY) || 'null') ||
  {
    date: new Date().toISOString().slice(0,10),

    lines: Array.from(
      {length:5},
      (_,i) => ({
        id:i+1,
        lot:'',
        desc:'',
        dims:'',
        fondos:'',
        humidity:'',
        speed:'',
        boxes:'',
        start:'',
        breakdowns:[]
      })
    )
  };


/* =========================================================
   GUARDAR
========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  render();

  toast('Guardado');
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function esc(v){

  return String(v ?? '').replace(
    /[&<>"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );

}


/* =========================================================
   MENSAJE
========================================================= */

function toast(t){

  const x = document.getElementById('toast');

  x.textContent = t;

  x.classList.add('show');

  setTimeout(
    () => x.classList.remove('show'),
    1400
  );

}


/* =========================================================
   FECHA
========================================================= */

function setDate(v){

  state.date = v;

  state.lines.forEach(
    l => l.date = v
  );

  save();

}


/* =========================================================
   RENDERIZAR
========================================================= */

function render(){

  document.getElementById('globalDate').value =
    state.date;


  document.getElementById('lines').innerHTML =
    state.lines.map(l => `

      <div class="line">

        <div class="linehead">

          <b>LÍNEA ${l.id}</b>

          <span class="status">
            ${l.start ? 'EN PRODUCCIÓN' : 'PARADA'}
          </span>

        </div>


        <div class="form">

          <div class="fields">


            <div class="field">
              <label>Número de lote</label>

              <input
                id="lot-${l.id}"
                value="${esc(l.lot)}"
              >
            </div>


            <div class="field">
              <label>Descripción de la caja</label>

              <input
                id="desc-${l.id}"
                value="${esc(l.desc)}"
                placeholder="Qué caja se está haciendo"
              >
            </div>


            <div class="field">
              <label>Dimensiones</label>

              <input
                id="dims-${l.id}"
                value="${esc(l.dims)}"
                placeholder="L × A × H"
              >
            </div>


            <div class="field">
              <label>Tipo de fondos</label>

              <input
                id="fondos-${l.id}"
                value="${esc(l.fondos)}"
              >
            </div>


            <div class="field">
              <label>Humedad del cuadradillo</label>

              <input
                id="humidity-${l.id}"
                value="${esc(l.humidity)}"
                placeholder="%"
              >
            </div>


            <div class="field">
              <label>Velocidad (cajas/hora)</label>

              <input
                id="speed-${l.id}"
                type="number"
                min="0"
                value="${esc(l.speed)}"
              >
            </div>


            <div class="field">
              <label>Cajas producidas</label>

              <input
                id="boxes-${l.id}"
                type="number"
                min="0"
                value="${esc(l.boxes)}"
              >
            </div>


            <div class="field">
              <label>Inicio de producción</label>

              <input
                id="start-${l.id}"
                type="datetime-local"
                value="${
                  l.start
                  ? new Date(l.start)
                      .toISOString()
                      .slice(0,16)
                  : ''
                }"
              >
            </div>

          </div>


          <button
            class="save"
            onclick="saveLine(${l.id})"
          >
            💾 GUARDAR LÍNEA ${l.id}
          </button>

        </div>

      </div>

    `).join('');


  /* SELECT DE AVERÍAS */

  document.getElementById('bdline').innerHTML =
    state.lines.map(l => `
      <option value="${l.id}">
        Línea ${l.id}
      </option>
    `).join('');


  /* TODAS LAS AVERÍAS */

  let all =
    state.lines.flatMap(
      l =>
        (l.breakdowns || []).map(
          b => ({
            ...b,
            line:l.id
          })
        )
    ).sort(
      (a,b) =>
        (b.at || '').localeCompare(a.at || '')
    );


  document.getElementById('breakdowns').innerHTML =
    all.length

    ?

    all.map(b => `

      <div class="bd">

        <b>
          Línea ${b.line} ·
          ${esc(b.reason || 'Avería')}
        </b>

        <div class="small">

          ${esc(b.at || '')}
          ·
          ${b.minutes || 0} min

          ${
            b.notes
            ? ' · ' + esc(b.notes)
            : ''
          }

        </div>


        <button
          class="danger"
          style="margin-top:7px;padding:7px 10px"
          onclick="delBd(${b.line},'${b.id}')"
        >
          Eliminar
        </button>

      </div>

    `).join('')

    :

    '<div class="empty">Todavía no hay averías.</div>';

}


/* =========================================================
   GUARDAR LÍNEA
========================================================= */

function saveLine(id){

  const l =
    state.lines.find(
      x => x.id === id
    );

  if(!l) return;


  l.lot =
    document.getElementById(`lot-${id}`).value.trim();

  l.desc =
    document.getElementById(`desc-${id}`).value.trim();

  l.dims =
    document.getElementById(`dims-${id}`).value.trim();

  l.fondos =
    document.getElementById(`fondos-${id}`).value.trim();

  l.humidity =
    document.getElementById(`humidity-${id}`).value.trim();

  l.speed =
    document.getElementById(`speed-${id}`).value;

  l.boxes =
    document.getElementById(`boxes-${id}`).value;


  const start =
    document.getElementById(`start-${id}`).value;

  l.start =
    start
    ? new Date(start).toISOString()
    : '';


  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  render();

  toast(`Línea ${id} guardada`);

}


/* =========================================================
   NUEVA JORNADA
========================================================= */

function newDay(){

  if(
    !confirm(
      '¿Crear una nueva jornada?\\n\\nLos datos actuales se conservarán solamente en el navegador si los has exportado.'
    )
  ){
    return;
  }


  const fecha =
    new Date().toISOString().slice(0,10);


  state = {

    date:fecha,

    lines:Array.from(
      {length:5},
      (_,i) => ({
        id:i+1,
        lot:'',
        desc:'',
        dims:'',
        fondos:'',
        humidity:'',
        speed:'',
        boxes:'',
        start:'',
        breakdowns:[]
      })
    )

  };


  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );


  render();

  toast('Nueva jornada creada');

}


/* =========================================================
   AÑADIR AVERÍA
========================================================= */

function addBreakdown(){

  const lineId =
    Number(
      document.getElementById('bdline').value
    );

  const at =
    document.getElementById('bdat').value;

  const minutes =
    Number(
      document.getElementById('bdmin').value || 0
    );

  const reason =
    document.getElementById('bdreason').value.trim();

  const notes =
    document.getElementById('bdnotes').value.trim();


  const line =
    state.lines.find(
      l => l.id === lineId
    );


  if(!line){
    toast('Selecciona una línea');
    return;
  }


  if(!reason){

    toast('Indica el motivo de la avería');

    document
      .getElementById('bdreason')
      .focus();

    return;
  }


  if(!line.breakdowns){
    line.breakdowns = [];
  }


  line.breakdowns.push({

    id:
      Date.now().toString(),

    at:
      at ||
      new Date().toISOString().slice(0,16),

    minutes,

    reason,

    notes

  });


  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );


  document.getElementById('bdat').value = '';
  document.getElementById('bdmin').value = '';
  document.getElementById('bdreason').value = '';
  document.getElementById('bdnotes').value = '';


  render();

  toast('Avería guardada');

}


/* =========================================================
   ELIMINAR AVERÍA
========================================================= */

function delBd(lineId,id){

  const line =
    state.lines.find(
      l => l.id === lineId
    );

  if(!line) return;


  if(
    !confirm(
      '¿Eliminar esta avería?'
    )
  ){
    return;
  }


  line.breakdowns =
    (line.breakdowns || [])
      .filter(
        b => String(b.id) !== String(id)
      );


  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );


  render();

  toast('Avería eliminada');

}


/* =========================================================
   EXPORTAR A EXCEL
========================================================= */

function exportXlsx(){

  let rows = [];


  rows.push([
    'Fecha',
    'Línea',
    'Número de lote',
    'Descripción de la caja',
    'Dimensiones',
    'Tipo de fondos',
    'Humedad del cuadradillo',
    'Velocidad (cajas/hora)',
    'Cajas producidas',
    'Inicio de producción'
  ]);


  state.lines.forEach(l => {

    rows.push([

      state.date,

      l.id,

      l.lot || '',

      l.desc || '',

      l.dims || '',

      l.fondos || '',

      l.humidity || '',

      l.speed || '',

      l.boxes || '',

      l.start
        ? new Date(l.start).toLocaleString('es-ES')
        : ''

    ]);

  });


  rows.push([]);

  rows.push([
    'AVERÍAS'
  ]);

  rows.push([
    'Fecha',
    'Línea',
    'Hora',
    'Duración (min)',
    'Motivo',
    'Observaciones'
  ]);


  state.lines.forEach(l => {

    (l.breakdowns || []).forEach(b => {

      rows.push([

        state.date,

        l.id,

        b.at || '',

        b.minutes || 0,

        b.reason || '',

        b.notes || ''

      ]);

    });

  });


  const csv =
    rows
      .map(row =>
        row
          .map(cell =>
            '"' +
            String(cell ?? '')
              .replace(/"/g,'""') +
            '"'
          )
          .join(';')
      )
      .join('\r\n');


  const blob =
    new Blob(
      ['\uFEFF' + csv],
      {
        type:'text/csv;charset=utf-8;'
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement('a');


  const fecha =
    state.date ||
    new Date().toISOString().slice(0,10);


  a.href = url;

  a.download =
    `Control-Produccion-${fecha}.csv`;


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);


  toast('Excel exportado');

}


/* =========================================================
   SERVICE WORKER / PWA
========================================================= */

if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register('./sw.js')

        .then(
          () => {
            console.log(
              'Service Worker registrado correctamente'
            );
          }
        )

        .catch(
          err => {
            console.error(
              'Error registrando Service Worker:',
              err
            );
          }
        );

    }
  );

}


/* =========================================================
   INICIO
========================================================= */

render();

</script>

</body>
</html>
